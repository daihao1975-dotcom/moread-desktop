name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Xcode 26+ is needed to compile the Icon Composer app icon.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          cd frontend && npm ci && npm run build   # Go embeds frontend/dist, so later Go steps need it
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
          cd frontend && npx prettier --check "src/**/*.{js,css}" "test/**/*.mjs"
      - name: Check third-party notices are current
        run: |
          python3 scripts/notices.py
          git diff --exit-code THIRD_PARTY_NOTICES.txt frontend/src/font-notice.txt
      - name: Test, build and package
        run: scripts/release.sh dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoRead-${{ github.sha }}
          path: dist/release
          retention-days: 14

  windows-test:
    # The release is cross-built on macOS; this job runs the Go tests on Windows itself.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test
        run: |
          go vet ./...
          go test ./...

  release:
    # A tag push or a version bump on main both produce a draft release; the draft is created once per version.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [build, windows-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MoRead-${{ github.sha }}
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls release/MoRead-*-Windows-x64.exe)
          version=${exe#release/MoRead-}
          version=${version%-Windows-x64.exe}
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          # Drafts have no tag yet, so look for the version among all releases, drafts included.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qx "$tag"; then
            echo "A release for $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "MoRead $version" --notes-file release/Release-Notes.md release/*
