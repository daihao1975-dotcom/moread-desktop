name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Xcode 26+ is needed to compile the Icon Composer app icon.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          cd frontend && npm ci && npm run build   # Go embeds frontend/dist, so later Go steps need it
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
          cd frontend && npx prettier --check "src/**/*.{js,css}" "test/**/*.mjs"
      - name: Check third-party notices are current
        run: |
          python3 scripts/notices.py
          git diff --exit-code THIRD_PARTY_NOTICES.txt frontend/src/font-notice.txt
      - name: Test, build and package
        run: scripts/release.sh dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoRead-${{ github.sha }}
          path: dist/release
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MoRead-${{ github.sha }}
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "MoRead ${GITHUB_REF_NAME#v}" --notes-file release/版本说明.md release/*
